[project]
name = "umsa-auditor"
version = "0.1.0"
description = "Auditor académico explicable del repositorio de tesis de Informática UMSA"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.50,<2",
  "pandas>=2.2,<3",
  "numpy>=2,<2.4",
  "scipy>=1.14,<2",
  "scikit-learn>=1.7,<2",
  "plotly>=6,<7",
  "joblib>=1.4,<2",
  "threadpoolctl>=3.5,<4",
  "pypdf>=5,<8",
  "requests>=2.31,<3",
  "python-dotenv>=1.1,<2",
  "sqlglot>=27,<40",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["repositorioUMSA.ipynb"]

